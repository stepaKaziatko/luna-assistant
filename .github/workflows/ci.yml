name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Минуты macOS-раннеров в закрытом репозитории стоят вдесятеро дороже, поэтому приложение
  # проверяется, только когда изменение может его затронуть.
  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="origin/$BASE_REF...HEAD" ;;
            push) range="$BEFORE..$GITHUB_SHA" ;;
            *) range= ;;
          esac
          app=true
          # Диапазон не разобрать (первый push ветки, переписанная история) — проверяем всё.
          if [ -n "$range" ] && files=$(git diff --name-only "$range" 2>/dev/null) &&
             ! printf '%s\n' "$files" | grep -qE '^(apps/macos/|tests/|scripts/|\.github/workflows/)'; then
            app=false
          fi
          # Коммит в main с ещё не выпущенной версией собирает и тестирует workflow Release —
          # второй раз те же проверки на macOS не гоняем.
          if [ "$GITHUB_EVENT_NAME" = push ] && version=$(scripts/check-version.sh) &&
             ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            app=false
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  version:
    name: Версия согласована
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-version.sh

  app:
    name: Приложение (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Код рассчитан на Swift 6.2 и SDK macOS 26: нужен Xcode 26+, он есть на образе macos-26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: XcodeGen
        run: brew install xcodegen
      - name: Тесты
        run: for t in scripts/test-*.sh; do echo "== $t"; bash "$t"; done
      - name: Бандл собирается и запускается
        run: |
          apps/macos/scripts/bundle.sh debug
          apps/macos/scripts/smoke.sh
