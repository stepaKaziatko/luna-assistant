name: Release

# Коммит в main с версией, у которой ещё нет тега, — это выпуск: бандлы собираются здесь
# и выкладываются релизом в публичный репозиторий, исходники остаются в этом. Тег ставится
# последним шагом, поэтому упавший выпуск повторяется перезапуском прогона.
# Ручной запуск собирает бандлы без публикации — их можно скачать из прогона.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Выпуски идут по одному: следующий прогон должен увидеть тег предыдущего.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: stepaKaziatko/luna-releases

permissions:
  contents: read

jobs:
  version:
    name: Версия
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(scripts/check-version.sh)
          build=true
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "Версия $version уже выпущена — собирать нечего."
              build=false
            else
              publish=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  macos:
    name: Luna.app (macOS, universal)
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: swift test
        working-directory: apps/macos
      - name: Собрать бандл
        env:
          LUNA_BUILD_NUMBER: ${{ github.run_number }}
        run: apps/macos/scripts/bundle.sh
      - name: Бандл запускается
        run: |
          lipo apps/macos/build/Luna.app/Contents/MacOS/Luna -verify_arch arm64 x86_64
          apps/macos/scripts/smoke.sh
      - name: Упаковать
        run: |
          mkdir dist
          ditto -c -k --keepParent apps/macos/build/Luna.app "dist/Luna-$VERSION-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/
          if-no-files-found: error

  # Приложения под другие ОС пока нет — для них собирается ядро без оболочки.
  # Новая платформа добавляется строкой в matrix.
  core:
    name: Ядро (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Упаковать ядро
        run: scripts/pack-core.sh "${{ matrix.platform }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Выложить релиз
    needs: [version, macos, core]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Бандлы — в публичный репозиторий
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: scripts/publish-release.sh "$TAG" dist
      # Здесь у релиза только тег и заметки: качать из закрытого репозитория никто не должен.
      - name: Тег и заметки — в этом репозитории
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "Luna $TAG"
