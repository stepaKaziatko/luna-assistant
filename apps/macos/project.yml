name: Luna
options:
  bundleIdPrefix: dev.luna
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

# DebugCloud = Debug, but signed with iCloud (CloudKit) and push entitlements
# and compiled with PHONE_LINK, for the iPhone link spike. ReleaseCloud = the
# same for a Developer ID build with its provisioning profile
# (scripts/cloud-test-build.sh); a Developer ID profile only allows the
# Production CloudKit environment, so the iPhone joins it with the
# LunaPhoneProduction scheme. Release also compiles PHONE_LINK (the sync
# stays off until turned on in Settings); Debug stays unsigned without it.
configs:
  Debug: debug
  DebugCloud: debug
  Release: release
  ReleaseCloud: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # Prevent Xcode from scanning Swift source and rewriting Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    DebugCloud:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      # Сертификата Developer ID у Luna нет: подпись ad-hoc, как и у нынешних сборок.
      # Своим сертификатом подписывает bundle.sh (LUNA_SIGN_IDENTITY).
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Resources/Luna.entitlements
    # Конфигурации *Cloud нужны для связи с iPhone: своя команда Apple Developer, контейнер
    # iCloud.dev.luna.Luna и профиль (docs/IPHONE.md). Luna их не собирает.
    ReleaseCloud:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  Luna:
    build:
      targets:
        Luna: all
    run:
      config: Debug
    archive:
      config: Release
  LunaAppStore:
    build:
      targets:
        LunaAppStore: all
    run:
      config: Debug
    archive:
      config: Release
  LunaCloud:
    build:
      targets:
        Luna: all
    run:
      config: DebugCloud
    archive:
      config: Release
  LunaAppStoreCloud:
    build:
      targets:
        LunaAppStore: all
    run:
      config: DebugCloud
    archive:
      config: Release
  LunaPhone:
    build:
      targets:
        LunaPhone: all
    run:
      config: Debug
    archive:
      config: Release
  # Same iPhone app on the Production CloudKit environment, to talk to the
  # Developer ID build (scripts/cloud-test-build.sh), which can only use Production.
  LunaPhoneProduction:
    build:
      targets:
        LunaPhone: all
    run:
      config: DebugCloud
    archive:
      config: Release

targets:
  Luna:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "Phone/**"
          - "Widgets/**"
          - "NotificationContent/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Luna
        CFBundleDisplayName: Luna
        CFBundleIdentifier: dev.luna.Luna
        CFBundleVersion: "15"
        CFBundleShortVersionString: "0.7.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Luna controls Terminal, iTerm2, Mail, Music and Spotify when you ask it to jump to an agent's terminal tab, send an email or play music."
        NSMicrophoneUsageDescription: "Luna uses the microphone when you dictate a message in the chat."
        NSSpeechRecognitionUsageDescription: "Luna turns your voice into the text of a chat message."
        NSAccessibilityUsageDescription: "Luna reads the title of the active window when you ask it to attach it as context."
        NSContactsUsageDescription: "Luna looks up an email address when you ask it, by voice, to prepare an email."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations:
          - en
          - ar
          - bn
          - es
          - fr
          - hi
          - id
          - pt-BR
          - ru
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.luna.Luna
        PRODUCT_NAME: Luna
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
      configs:
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/LunaCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG PHONE_LINK"
          # The build run every day from Xcode: optimized like Release, so Luna's
          # drawing costs what it costs for users (unoptimized Swift was ~2× the CPU).
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        # Распространяемая сборка Luna идёт без связи с iPhone (нет команды Apple Developer
        # и контейнера iCloud): энтайтлменты как у Debug, PHONE_LINK не компилируется.
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/Luna.entitlements
        ReleaseCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/LunaReleaseCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PHONE_LINK
    postBuildScripts:
      - name: "Write Git Hash to Info.plist"
        script: |
          HASH=$(git -C "${SRCROOT}/.." rev-parse --short HEAD 2>/dev/null || echo "unknown")
          /usr/libexec/PlistBuddy -c "Set :LunaGitHash ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :LunaGitHash string ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        showEnvVars: false

  LunaAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "Phone/**"
          - "Widgets/**"
          - "NotificationContent/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: Luna
        CFBundleDisplayName: Luna
        CFBundleIdentifier: dev.luna.LunaPhone
        CFBundleVersion: "6"
        CFBundleShortVersionString: "1.1"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: NO
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations:
          - en
          - ar
          - bn
          - es
          - fr
          - hi
          - id
          - pt-BR
          - ru
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.luna.LunaPhone
        PRODUCT_NAME: Luna
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/LunaAppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        CODE_SIGNING_ALLOWED: YES
      configs:
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/LunaAppStoreCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE PHONE_LINK"
        # App Store archive: same iCloud entitlements; Xcode switches push to
        # production when exporting for the App Store.
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/LunaAppStoreCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE PHONE_LINK"

  # iPhone app. Same bundle ID as the Mac App Store build, for universal purchase.
  LunaPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - target: LunaWidgets
      - target: LunaNotificationContent
    sources:
      - path: Sources/Phone
        type: group
      # Shared with the Mac targets (they get it through Sources/).
      - path: Sources/LunaKit
        type: group
      - path: PhoneAssets.xcassets
        buildPhase: resources
      # Luna's sounds for the iPhone's notifications.
      - path: Resources/sounds/approval.wav
        buildPhase: resources
      - path: Resources/sounds/finish.wav
        buildPhase: resources
      - path: Resources/sounds/question.wav
        buildPhase: resources
      - path: Resources/sounds/error.wav
        buildPhase: resources
    info:
      path: Resources/InfoPhone.plist
      properties:
        CFBundleName: Luna
        CFBundleDisplayName: Luna
        CFBundleIdentifier: dev.luna.LunaPhone
        CFBundleVersion: "3"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: YES
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: YES
        UIBackgroundModes:
          - remote-notification
        # Portrait, except a diff opened full screen (PhoneAppDelegate decides).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: NO
        NSFaceIDUsageDescription: "Luna asks for Face ID before allowing a command from your iPhone."
        NSMicrophoneUsageDescription: "Luna uses the microphone when you dictate an instruction for Claude Code."
        NSSpeechRecognitionUsageDescription: "Luna turns your voice into the text of an instruction for Claude Code."
        NSSupportsLiveActivities: YES
        # Lets Luna move at 120 Hz on ProMotion screens, like the Mac's notch.
        CADisableMinimumFrameDurationOnPhone: YES
        # Steps change often while an agent works: without this, iOS holds back
        # updates once its budget is spent, and "waiting for your OK" came late.
        NSSupportsLiveActivitiesFrequentUpdates: YES
        # luna://session/<id>: the widgets open a session in the app.
        CFBundleURLTypes:
          - CFBundleURLName: dev.luna.LunaPhone
            CFBundleURLSchemes:
              - luna
        # Which APNs environment the Live Activity tokens belong to (read by the Mac).
        LunaAPNsEnvironment: $(LUNA_APNS_ENV)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.luna.LunaPhone
        PRODUCT_NAME: Luna
        INFOPLIST_FILE: Resources/InfoPhone.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Luna in other colors, picked in Settings (UIApplication.setAlternateIconName).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blue AppIcon-Green AppIcon-Purple AppIcon-Pink AppIcon-Graphite"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        LUNA_APNS_ENV: production
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/LunaPhone.entitlements
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
      configs:
        Debug:
          LUNA_APNS_ENV: development
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/LunaPhoneProduction.entitlements
          LUNA_APNS_ENV: development

  # Home Screen and Lock Screen widgets (Solo, Team, List, accessories). They
  # read the sessions the iPhone app saves to the shared App Group.
  LunaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Widgets
        type: group
      - path: Sources/LunaKit
        type: group
      - path: Sources/Phone/SharedSessions.swift
      - path: Sources/Phone/MacStubs.swift
      - path: Sources/Phone/LunaActivityAttributes.swift
      - path: Sources/Phone/OpenLeadLunaIntent.swift
      - path: Sources/Phone/DenyApprovalIntent.swift
    info:
      path: Resources/InfoWidgets.plist
      properties:
        CFBundleName: LunaWidgets
        CFBundleDisplayName: Luna
        CFBundleIdentifier: dev.luna.LunaPhone.Widgets
        CFBundleVersion: "3"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.luna.LunaPhone.Widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        PRODUCT_NAME: LunaWidgets
        INFOPLIST_FILE: Resources/InfoWidgets.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/LunaWidgets.entitlements
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # The expanded approval notification: Luna alive, with the command.
  LunaNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/NotificationContent
        type: group
      - path: Sources/LunaKit
        type: group
      - path: Sources/Phone/LunaLive.swift
      - path: Sources/Phone/MacStubs.swift
    info:
      path: Resources/InfoNotificationContent.plist
      properties:
        CFBundleName: LunaNotificationContent
        CFBundleDisplayName: Luna
        CFBundleIdentifier: dev.luna.LunaPhone.NotificationContent
        CFBundleVersion: "3"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: LUNA_APPROVAL
            UNNotificationExtensionInitialContentSizeRatio: 0.45
            UNNotificationExtensionDefaultContentHidden: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.luna.LunaPhone.NotificationContent
        PRODUCT_NAME: LunaNotificationContent
        INFOPLIST_FILE: Resources/InfoNotificationContent.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
