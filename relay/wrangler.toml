# Luna relay: forwards Live Activity pushes from the Mac app to Apple (APNs).
# Deploy: see README.md. Secrets (never in git): APNS_KEY, APNS_KEY_ID.
name = "luna-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Your Apple developer team ID (10 characters, developer.apple.com → Membership) and your
# iPhone app's bundle ID followed by .push-type.liveactivity. See docs/IPHONE.md.
APNS_TEAM_ID = "YOUR_TEAM_ID"
APNS_TOPIC = "dev.luna.LunaPhone.push-type.liveactivity"

[observability]
enabled = false
